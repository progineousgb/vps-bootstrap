name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ansible-lint
      - name: ansible syntax and lint
        working-directory: ansible
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-playbook -i inventory.example.ini --syntax-check site.yml
          ansible-lint
      - name: cloud-init schema
        run: |
          sudo apt-get update && sudo apt-get install -y cloud-init
          cloud-init schema -c cloud-init/user-data.yaml
