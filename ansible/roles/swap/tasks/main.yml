- name: Check existing swap
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: swap_active
  changed_when: false

- name: Create swap file
  when: swap_size_mb | int > 0 and swap_active.stdout | length == 0
  block:
    - name: Allocate swap file
      ansible.builtin.command: dd if=/dev/zero of={{ swap_file }} bs=1M count={{ swap_size_mb }} status=none
      args:
        creates: "{{ swap_file }}"

    - name: Set swap file permissions
      ansible.builtin.file:
        path: "{{ swap_file }}"
        owner: root
        group: root
        mode: "0600"

    - name: Format swap file
      ansible.builtin.command: mkswap {{ swap_file }}
      changed_when: true

    - name: Enable swap file
      ansible.builtin.command: swapon {{ swap_file }}
      changed_when: true

- name: Add swap to fstab
  ansible.posix.mount:
    src: "{{ swap_file }}"
    path: none
    fstype: swap
    opts: sw
    state: present
  when: swap_size_mb | int > 0 and (swap_active.stdout | length == 0 or swap_file in swap_active.stdout)

- name: Set swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ swap_swappiness }}"
    sysctl_file: /etc/sysctl.d/99-swappiness.conf
    state: present
